name: nfl-fair-value
services:
  backend:
    image: nfl-fair-value-backend:latest
    pull_policy: never
    build:
      context: .
      target: backend
    init: true
    restart: unless-stopped
    environment:
      NFL_DATA_DIR: /data
      NFL_SCHEDULE_CACHE_MINUTES: "15"
      NFL_PAPER_DB: /data/trading/paper_trading.sqlite3
      NFL_PAPER_OPERATOR_TOKEN_FILE: /run/secrets/paper_operator_token
    secrets:
      - paper_operator_token
    volumes:
      - predictions:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  bot:
    build:
      context: .
      target: bot
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NFL_API_URL: http://backend:8000
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-1572302708419985518}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-1572300706478817441}
      DISCORD_TOKEN_FILE: /run/secrets/discord_token
      DISCORD_STATE_PATH: /state/discord.sqlite3
      NFL_PAPER_OPERATOR_TOKEN_FILE: /run/secrets/paper_operator_token
    secrets:
      - discord_token
      - paper_operator_token
    volumes:
      - bot-state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import time,pathlib; assert time.time()-float(pathlib.Path('/state/discord.heartbeat').read_text())<180"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  paper-worker:
    # PAPER_ONLY: records public market data and simulates orders locally. Never submits real orders.
    build:
      context: .
      target: backend
    init: true
    restart: unless-stopped
    command: ["python", "-m", "backend.trading.worker"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NFL_DATA_DIR: /data
      NFL_PAPER_DB: /data/trading/paper_trading.sqlite3
      NFL_SCHEDULE_CACHE_MINUTES: "15"
    volumes:
      - predictions:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,datetime,pathlib; s=json.loads(pathlib.Path('/data/trading/worker.health.json').read_text()); assert s.get('phase') != 'error'; assert (datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(s.get('last_heartbeat') or s['last_loop'])).total_seconds()<180"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  crypto-worker:
    image: nfl-fair-value-backend:latest
    pull_policy: never
    init: true
    restart: unless-stopped
    command: ["python", "-m", "backend.crypto.worker"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NFL_DATA_DIR: /data
    volumes:
      - predictions:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import datetime as dt,json,pathlib; h=json.loads(pathlib.Path('/data/crypto/health.json').read_text()); assert (dt.datetime.now(dt.timezone.utc)-dt.datetime.fromisoformat(h['last_heartbeat'])).total_seconds()<180"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  updown-worker:
    image: nfl-fair-value-backend:latest
    pull_policy: never
    init: true
    restart: unless-stopped
    command: ["python", "-m", "backend.updown.worker"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NFL_DATA_DIR: /data
    volumes:
      - predictions:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import datetime as dt,json,pathlib; h=json.loads(pathlib.Path('/data/updown/health.json').read_text()); assert (dt.datetime.now(dt.timezone.utc)-dt.datetime.fromisoformat(h['last_heartbeat'])).total_seconds()<180"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  predictions:
  bot-state:
secrets:
  discord_token:
    file: ${DISCORD_TOKEN_FILE_HOST:-./.secrets/discord_token.txt}
  paper_operator_token:
    file: ${PAPER_OPERATOR_TOKEN_FILE_HOST:-./.secrets/paper_operator_token.txt}
